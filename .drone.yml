kind: pipeline
name: Maven Build
type: docker

steps:

  - name: release-plugin-prepare
    image: maven:3.8.4-openjdk-11
    environment:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      DRONE_DEBUG: true
      GIT_USERNAME:
        from_secret: git_username
      PAT_TOKEN:
        from_secret: pat_token
      NEXUS_USERNAME:
        from_secret: nexus_username
      NEXUS_PASSWORD:
        from_secret: nexus_password
      GIT_EMAIL:
        from_secret: git_email
    commands:
      - apt-get update && apt-get install -y git
      - git config --global user.email "$GIT_EMAIL"
      - git config --global user.name "$GIT_USERNAME"
      - mvn release:prepare --batch-mode -Dgit.token=$PAT_TOKEN -Dgit.username=$GIT_USERNAME -DautoVersionSubmodules=true -X
      - |
        cat > $GITHUB_WORKSPACE/settings.xml <<EOL
        <settings>
        <servers>
        <server>
        <id>nexus</id>
        <username>$NEXUS_USERNAME</username>
        <password>$NEXUS_PASSWORD</password>
        </server>
        </servers>
        </settings>
        EOL

        mvn release:perform -s $GITHUB_WORKSPACE/settings.xml        

    when:
      branch:
        - master
      event:
        - push
      ref:
        - refs/heads/master
        - refs/tags/*

  - name: notify
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{#success build.status}}✅ Build Successful!{{else}}❌ Build Failed!{{/success}}
        **Repository:** `[{{repo.name}}/{{commit.branch}}]`
        **Event:** `[{{uppercase build.event}}]` triggered the build.
        **Commit:** [[{{commit.sha}}]({{commit.link}})]
        **Author:** `[{{commit.author}} / {{commit.email}}]`
        **Message:** {{commit.message}}
        **Build Status:** `[{{uppercase build.status}}]`
        **Build Number:** `#{{build.number}}`
        **Timestamp:** `[{{datetime build.finished "2006.01.02 15:04" ""}}]`
    when:
      status: [ success, failure, changed ]


image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback


volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: cache
    host:
      path: /tmp/.buildx-cache