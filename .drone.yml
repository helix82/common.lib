kind: pipeline
name: Maven Build
type: docker

steps:
  - name: release-plugin
    image: maven:3.8.4-openjdk-11-slim
    environment:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      DRONE_DEBUG: true
      GIT_USERNAME:
        from_secret: git_username
      PAT_TOKEN:
        from_secret: pat_token
      GIT_EMAIL:
          from_secret: git_email
      NEXUS_USERNAME:
        from_secret: nexus_username
      NEXUS_PASSWORD:
        from_secret: nexus_password
    commands:
      - apt-get update && apt-get install -y git
      - git --version
      - git config --global user.email "$GIT_EMAIL"
      - git config --global user.name "$GIT_USERNAME"
      - git fetch
      - git tag
      - mvn release:prepare --batch-mode -Dgit.token=$PAT_TOKEN -Dgit.username=$GIT_USERNAME -X
      - cat > ${DRONE_WORKSPACE}/settings.xml <<EOL
        <settings>
        <servers>
        <server>
        <id>nexus</id>
        <username>$NEXUS_USERNAME</username>
        <password>$NEXUS_PASSWORD</password>
        </server>
        </servers>
        </settings>
        EOL
      - mvn release:perform -s ${DRONE_WORKSPACE}/settings.xml
    when:
      branch:
        - master
      event:
        - push
      ref:
        - refs/heads/master
        - refs/tags/*


image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback
      - tag

volumes:
  - name: cache
    temp: {}
