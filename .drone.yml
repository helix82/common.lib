  - name: set-up-java
    image: maven:3.8.4-openjdk-11-slim
    environment:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
    commands:
      - |
        cat > ${DRONE_WORKSPACE}/settings.xml <<EOL
        <settings>
          <servers>
            <server>
              <id>nexus</id>
              <username>$NEXUS_USERNAME</username>
              <password>$NEXUS_PASSWORD</password>
            </server>
          </servers>
        </settings>
        EOL

  - name: build
    image: maven:3.8.4-openjdk-11-slim
    environment:
      PAT_TOKEN: ${PAT_TOKEN}
      GIT_USERNAME: ${GIT_USERNAME}
    commands:
      - git config --global user.email "androkc1999@example.com"
      - git config --global user.name "androkc1999"
      - mvn release:prepare --batch-mode -Dgit.token=${PAT_TOKEN} -Dgit.username=${GIT_USERNAME}
      - mvn release:perform -s ${DRONE_WORKSPACE}/settings.xml


image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback
    commit:
      exclude:
        - '*[maven-release-plugin]*'

volumes:
  - name: cache
    temp: {}
