kind: pipeline
name: Maven Build
type: docker

steps:
  - name: Release
    image: eclipse-temurin:11
    environment:
      MAVEN_HOME: /usr/share/maven
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk
      DRONE_DEBUG: true
      GIT_USERNAME:
        from_secret: git_username
      GIT_EMAIL:
        from_secret: git_email
      PAT_TOKEN:
        from_secret: pat_token
      NEXUS_USERNAME:
        from_secret: nexus_username
      NEXUS_PASSWORD:
        from_secret: nexus_password
    commands:
      - apt-get update
      - apt-get install -y maven git
      - git config --global user.email "$GIT_EMAIL"
      - git config --global user.name "$GIT_USERNAME"
      - |
        export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
        
        cat > settings.xml <<EOL
        <settings>
          <servers>
            <server>
              <id>nexus</id>
              <username>${NEXUS_USERNAME}</username>
              <password>${NEXUS_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOL
        
        
        mvn release:prepare --batch-mode -Dgit.token=${PAT_TOKEN} -Dgit.username=${GIT_USERNAME}
        
        mvn release:perform -s settings.xml

    when:
      status:
        - success
      condition:
        contains:
          - skip_build: run
      branch:
        - master

  - name: Clean up
    image: alpine
    commands:
      - rm -f settings.xml
    when:
      status:
        - success
      condition:
        contains:
          - skip_build: run
      branch:
        - master

  - name: notify
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{#success build.status}}✅ Build Successful!{{else}}❌ Build Failed!{{/success}}
        **Repository:** `[{{repo.name}}/{{commit.branch}}]`
        **Event:** `[{{uppercase build.event}}]` triggered the build.
        **Commit:** [[{{commit.sha}}]({{commit.link}})]
        **Author:** `[{{commit.author}} / {{commit.email}}]`
        **Message:** {{commit.message}}
        **Build Status:** `[{{uppercase build.status}}]`
        **Build Number:** `#{{build.number}}`
        **Timestamp:** `[{{datetime build.finished "2006.01.02 15:04" ""}}]`
    when:
      status: [ success, failure, changed ]

image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback
    commit:
      exclude:
        - '*[maven-release-plugin]*'

