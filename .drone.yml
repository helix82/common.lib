kind: pipeline
name: Maven Build
type: docker

steps:
  - name: release-plugin
    image: maven:3.8.4-openjdk-11-slim
    environment:
      MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
      DRONE_DEBUG: true
      GIT_USERNAME:
        from_secret: git_username
      PAT_TOKEN:
        from_secret: pat_token
      GIT_EMAIL:
          from_secret: git_email
    commands:
      - apt-get update && apt-get install -y git
      - git --version
      - git config --global user.email "$GIT_EMAIL"
      - git config --global user.name "$GIT_USERNAME"
      - git fetch
      - git tag
      - echo "Using GIT_USERNAME: $GIT_USERNAME"
      - echo "Using GIT_EMAIL: $GIT_EMAIL"
      - mvn release:prepare --batch-mode -Dgit.token=$PAT_TOKEN -Dgit.username=$GIT_USERNAME -X
      - mvn release:perform -s ${DRONE_WORKSPACE}/build/settings.xml
    when:
      branch:
        - master



image_pull_secrets:
  - dockerconfig

node:
  node: 188.120.226.58

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback
    commit:
      exclude:
        - '*[maven-release-plugin]*'

volumes:
  - name: cache
    temp: {}
