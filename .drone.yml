image_pull_secrets:
  - dockerconfig

node:
  node: 149.154.64.5

trigger:
  event:
    include:
      - push
      - pull_request
      - rollback


volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: cache
    host:
      path: /tmp/.buildx-cache